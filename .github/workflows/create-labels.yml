name: Create Labels

on:
  workflow_dispatch:  # Ручной запуск один раз для создания меток
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-labels.yml'

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
    - name: Create or update labels
      uses: actions/github-script@v8
      with:
        script: |
          const labels = [
            { name: 'dependencies', color: '0366d6', description: 'Pull requests that update a dependency file / Обновления зависимостей' },
            { name: 'github-actions', color: '000000', description: 'Pull requests that update GitHub Actions code / Обновления GitHub Actions' },
            { name: 'npm', color: 'cb3837', description: 'Pull requests that update npm dependencies / Обновления npm пакетов' },
            { name: 'bot', color: '5865F2', description: 'Related to Discord bot / Относится к Discord боту' },
            { name: 'api', color: '0e8a16', description: 'Related to API / Относится к API' },
            { name: 'web', color: 'fbca04', description: 'Related to web interface / Относится к веб-интерфейсу' },
            { name: 'docker', color: '0db7ed', description: 'Related to Docker / Относится к Docker' },
            { name: 'bug', color: 'd73a4a', description: 'Something is not working / Что-то не работает' },
            { name: 'enhancement', color: 'a2eeef', description: 'New feature or request / Новая функция или запрос' },
            { name: 'documentation', color: '0075ca', description: 'Improvements or additions to documentation / Улучшения документации' },
            { name: 'security', color: 'ee0701', description: 'Security vulnerability / Уязвимость безопасности' },
          ];

          for (const label of labels) {
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name,
                color: label.color,
                description: label.description
              });
              console.log(`✅ Created label: ${label.name}`);
            } catch (error) {
              if (error.status === 422) {
                // Label already exists, update it
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`🔄 Updated label: ${label.name}`);
              } else {
                console.error(`❌ Error with label ${label.name}:`, error.message);
              }
            }
          }
